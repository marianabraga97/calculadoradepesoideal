<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Peso Ideal</title>
</head>
<body>
    
    <h1> Calculadora de Peso Ideal </h1>

    <div class="container">
        <div>
            <img src="./images/balanca.png" alt="balanca" class="images">
        </div>
        <div>
            <form>
                <p>
                    <label for="inNome">Nome:</label>
                    <input type="text" id="inNome" required>
                </p>
                <p>
                    <label for="sexo">Sexo</label>
                    <input type="radio" id="inMasculino" name="sexo" required> Masculino
                    <input type="radio" id="inFeminino" name="sexo" required> Feminino
                </p>

                <p>
                    <label for="inAltura">Altura em (m)</label>
                    <input type="number" min="0" step = "0.01" id="inAltura" required>
                </p>

                <p>
                    <input type="submit" value="Calcular Peso Ideal">
                    <input type="reset" value="Limpar campos">
                </p>
            
            </form>

            <h3>

            </h3>
        
        </div>
    </div>
    <script src="./js/script.js"></script>
</body>
</html>
